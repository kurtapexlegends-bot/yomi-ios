name: Yomi
options:
  bundleIdPrefix: com.yomiapp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  YomiModules:
    path: .

targets:
  Yomi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/YomiApp
    dependencies:
      - package: YomiModules
        product: YomiCore
      - package: YomiModules
        product: YomiDatabase
      - package: YomiModules
        product: YomiExtensions
      - package: YomiModules
        product: YomiReader
      - package: YomiModules
        product: YomiDownload
      - package: YomiModules
        product: YomiSync
      - package: YomiModules
        product: YomiUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yomiapp.reader
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: Yomi
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ONLY_ACTIVE_ARCH: NO
        GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES
