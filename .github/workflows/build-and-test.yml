name: Yomi iOS CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Package Yomi
    runs-on: macos-14

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: |
        if [ -d "/Applications/Xcode_16.2.app" ]; then
          sudo xcode-select -s /Applications/Xcode_16.2.app
        elif [ -d "/Applications/Xcode_16.1.app" ]; then
          sudo xcode-select -s /Applications/Xcode_16.1.app
        elif [ -d "/Applications/Xcode_16.0.app" ]; then
          sudo xcode-select -s /Applications/Xcode_16.0.app
        fi
        xcodebuild -version

    - name: Run Swift Unit Tests
      run: swift test -v

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build iOS Simulator App (.app for Appetize.io)
      run: |
        xcodebuild build \
          -project Yomi.xcodeproj \
          -scheme Yomi \
          -sdk iphonesimulator \
          -destination "generic/platform=iOS Simulator" \
          -configuration Release \
          -derivedDataPath derived_data_sim \
          ONLY_ACTIVE_ARCH=NO \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Upload Appetize Simulator Bundle (Drag & Drop into Appetize.io)
      uses: actions/upload-artifact@v4
      with:
        name: Yomi-Appetize-Simulator
        path: derived_data_sim/Build/Products/Release-iphonesimulator/Yomi.app
        retention-days: 14

    - name: Build iOS Device App & Package IPA (for Sideloadly / AltStore)
      run: |
        xcodebuild build \
          -project Yomi.xcodeproj \
          -scheme Yomi \
          -destination "generic/platform=iOS" \
          -configuration Release \
          -derivedDataPath derived_data_device \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

        mkdir -p build_output
        cd derived_data_device/Build/Products/Release-iphoneos
        mkdir -p Payload
        cp -R Yomi.app Payload/
        zip -r -y ../../../../build_output/Yomi.ipa Payload
        cd ../../../..

    - name: Upload Sideload IPA (For Sideloadly & AltStore)
      uses: actions/upload-artifact@v4
      with:
        name: Yomi-Device-IPA
        path: build_output/Yomi.ipa
        retention-days: 14
