name: Yomi iOS CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Package Yomi
    runs-on: macos-14

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Run Swift Unit Tests
      run: swift test -v

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build iOS Simulator App (.app for Appetize.io)
      run: |
        xcodebuild build \
          -project Yomi.xcodeproj \
          -scheme Yomi \
          -destination "generic/platform=iOS Simulator" \
          -configuration Release \
          -derivedDataPath derived_data_sim \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Package Simulator App (.zip for Appetize.io)
      run: |
        mkdir -p build_output
        cd derived_data_sim/Build/Products/Release-iphonesimulator
        zip -r -y ../../../../build_output/Yomi-Simulator.zip Yomi.app
        cd ../../../..

    - name: Build iOS Device App & Package IPA (for Sideloadly / AltStore)
      run: |
        xcodebuild build \
          -project Yomi.xcodeproj \
          -scheme Yomi \
          -destination "generic/platform=iOS" \
          -configuration Release \
          -derivedDataPath derived_data_device \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

        cd derived_data_device/Build/Products/Release-iphoneos
        mkdir -p Payload
        cp -R Yomi.app Payload/
        zip -r -y ../../../../build_output/Yomi.ipa Payload
        cd ../../../..

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Yomi-App-Builds
        path: build_output/
        retention-days: 14
